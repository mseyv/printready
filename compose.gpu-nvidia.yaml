# NVIDIA GPU. Requires the NVIDIA Container Toolkit on the host; it injects the
# driver's Vulkan ICD because NVIDIA_DRIVER_CAPABILITIES includes "graphics".
services:
  upscaler:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, compute, utility]
