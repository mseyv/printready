# Base service. Runs anywhere; without a GPU override, Real-ESRGAN runs on the
# CPU through Mesa lavapipe (works, but several times slower).
#
#   echo "DOWNLOAD_URL_SECRET=$(openssl rand -hex 32)" > .env
#   docker compose up -d --build                                              # CPU
#   docker compose -f compose.yaml -f compose.gpu-dri.yaml up -d --build      # Intel / AMD GPU
#   docker compose -f compose.yaml -f compose.gpu-nvidia.yaml up -d --build   # NVIDIA GPU
services:
  upscaler:
    build: .
    image: upscaler:latest
    restart: unless-stopped
    ports:
      - "${UPSCALER_PORT:-3000}:3000"
    environment:
      DOWNLOAD_URL_SECRET: ${DOWNLOAD_URL_SECRET:?Set DOWNLOAD_URL_SECRET (≥32 chars) in .env}
      REALESRGAN_MODEL: ${REALESRGAN_MODEL:-realesrgan-x4plus}
      REALESRGAN_TILE: ${REALESRGAN_TILE:-0}
      JOB_TTL_MINUTES: ${JOB_TTL_MINUTES:-30}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-900}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_OUTPUT_PIXELS: ${MAX_OUTPUT_PIXELS:-64000000}
      # 1 when published behind a reverse proxy that appends X-Forwarded-For (recommended).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      # Hosted engine instead of the local binary:
      # UPSCALE_ENGINE: replicate
      # REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
    volumes:
      # Temporary job files (cleaned automatically; wiped on start).
      - upscaler-jobs:/data
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  upscaler-jobs:
